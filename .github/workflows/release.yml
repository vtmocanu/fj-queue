name: release

# On each v* tag, regenerate Formula/fj-queue.rb and push it to
# vtmocanu/homebrew-tap. The default GITHUB_TOKEN cannot write to a second
# repo, so the cross-repo push uses HOMEBREW_TAP_TOKEN (a fine-grained PAT
# scoped to vtmocanu/homebrew-tap with contents:write). The bump itself is a
# plain `git push` from the Taskfile (see Taskfile.yml), not a third-party action.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish the formula for (e.g. v2.0.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate formula
        run: task homebrew-formula VERSION="$TAG"

      - name: Publish to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: task homebrew-publish VERSION="$TAG" HOMEBREW_TAP_TOKEN="$HOMEBREW_TAP_TOKEN"
