name: release

# On each v* tag, regenerate Formula/fj-queue.rb and push it to
# vtmocanu/homebrew-tap. The default GITHUB_TOKEN cannot write to a second
# repo, so the cross-repo push uses HOMEBREW_TAP_TOKEN (a fine-grained PAT
# scoped to vtmocanu/homebrew-tap with contents:write). The bump itself is a
# plain `git push` from the Taskfile (see Taskfile.yml), not a third-party action.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish the formula for (e.g. v0.0.1)"
        required: true

permissions:
  contents: write # create the GitHub Release on tag push; the tap push uses HOMEBREW_TAP_TOKEN

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Taskfile.yml includes a reusable file from github.com/vtmocanu/task over
      # https in CI; remote Taskfiles are an experimental Task feature behind this
      # flag, and `task --yes` auto-confirms the one-time remote-trust prompt.
      TASK_X_REMOTE_TASKFILES: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Git ref names allow shell metacharacters (quotes, $, ;, |), and TAG
      # flows into Task template substitution where quoting cannot be relied
      # on. Only strict semver tags may proceed. $TAG is expanded by the
      # shell from env, never by GH expressions, so this check is injection-safe.
      - name: Validate tag format
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing to publish: tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      # Cut a GitHub Release with auto-generated notes. Tag pushes only — a
      # manual re-bump dispatch leaves the existing release untouched.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate formula
        run: task --yes brew:formula VERSION="$TAG"

      - name: Publish to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: task --yes brew:publish VERSION="$TAG" HOMEBREW_TAP_TOKEN="$HOMEBREW_TAP_TOKEN"
