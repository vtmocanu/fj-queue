---
# Release automation. The generic mechanics (compute the tarball sha256, render
# the formula, push it to the tap) live in the reusable homebrew-tap.yml in
# github.com/vtmocanu/task; this repo owns only the formula body (Formula.rb.tmpl)
# and the identity vars below. Run by .github/workflows/release.yml on each v*
# tag, and runnable locally.
version: "3"

vars:
  # Reusable task library: public GitHub repo (github.com/vtmocanu/task).
  # Local checkout while developing; public raw URL in CI (no token needed).
  TASK_REPO_LOCAL: ~/stuff/gitrepos/gh/vtmocanu/task
  TASK_REPO_RAW: https://raw.githubusercontent.com/vtmocanu/task/main

includes:
  brew:
    taskfile: "{{if .CI}}{{.TASK_REPO_RAW}}/homebrew-tap.yml{{else}}{{.TASK_REPO_LOCAL}}/homebrew-tap.yml{{end}}"
    vars:
      NAME: fj-queue
      GH_REPO: vtmocanu/fj-queue
      TAP_REPO: vtmocanu/homebrew-tap

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
