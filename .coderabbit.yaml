# CodeRabbit Configuration
# Documentation: https://docs.coderabbit.ai/guides/configure-coderabbit
# Adapted from the uzi repo's .coderabbit.yaml for fj-queue (single-file Python CLI).
# Only the parts that make sense here were carried over: uzi's Go/shell/TS tool
# disables and handler/web/ideas path rules are uzi-specific and were dropped.

# Reduce review noise by focusing on actionable issues
reviews:
  # Two-step review: submit "Request changes" while issues are open, auto-switch
  # to "Approve" once they are resolved. (Not a severity filter; it can request
  # changes for lower-severity comments too.)
  request_changes_workflow: true

  # Reduce comment verbosity
  high_level_summary: true
  poem: false
  review_status: false

  # Collapse less important sections
  collapse_walkthrough: true

  # Leaner walkthrough (defaults are on; these PRs don't need the effort estimate)
  estimate_code_review_effort: false
  review_details: false

  # NOTE (deliberately different from uzi): fj-queue's CI gate is pytest only
  # (3.11/3.12/3.13) and owns no linter, so there is nothing for CodeRabbit's
  # bundled tools (ruff, gitleaks, ...) to duplicate. Leaving them at default
  # gives this repo lint/secret coverage it otherwise has none of, so unlike uzi
  # we do NOT disable them.

  # Skip generated, vendored, and build output
  path_filters:
    - "!**/__pycache__/**"
    - "!.venv/**"                             # local virtualenv
    - "!**/*.egg-info/**"                     # build metadata
    - "!uv.lock"                              # resolved lockfile
    - "!dist/**"                              # generated Homebrew formula (release artifact)
    - "!tests/__snapshots__/**"              # syrupy-generated snapshots

  auto_review:
    enabled: true
    drafts: false
    # Only auto-review PRs whose base is one of these.
    base_branches:
      - main
    # Skip dependency bots: CI is the correct validator for a version bump, and a
    # lockfile/version diff review is noise. Unlike uzi, the TITLE keywords are the
    # load-bearing signal here: Renovate opens PRs both as the Mend GitHub App
    # (renovate[bot]) AND under the maintainer's own account, so a username filter
    # alone misses half of them. Every Renovate PR is semantic-commit titled
    # (chore(deps)/fix(deps)/build(deps)), so the title keywords catch both.
    ignore_usernames:
      - "renovate[bot]"
    ignore_title_keywords:
      - "chore(deps)"
      - "fix(deps)"
      - "build(deps)"

  # Path-specific instructions
  path_instructions:
    # Tests: correctness/coverage only, and specifically hunt the vacuous-assertion
    # trap — an assertion against a falsy/zero default or mere absence-of-exception
    # passes even when the behavior regressed.
    - path: "tests/**/*.py"
      instructions: "Focus on test correctness and coverage gaps only; skip style. Flag vacuous assertions: a test must assert the meaningful value, not merely a falsy/zero default or the absence of an exception, which would still pass if the behavior regressed."

    - path: "docs/**"
      instructions: "Only review for clarity and completeness. Skip markdown style suggestions."

    - path: "prds/**"
      instructions: "Only review for clarity and completeness. Skip markdown style suggestions."

    # Hand-authored JSON Schema for the --json output; its contract is documented.
    - path: "schema/**"
      instructions: "This is the hand-authored JSON Schema contract for the --json output. Flag correctness gaps against the documented contract (docs/json-contract.md), not style."

# Limit review scope
language: "en-US"
early_access: false

# Reduce nitpick comments (root-level per the CodeRabbit schema; it is ignored
# when nested under reviews:).
tone_instructions: "Focus only on critical bugs, security issues, and architectural concerns. Skip style nitpicks and minor improvements unless they significantly impact code quality or maintainability."

chat:
  auto_reply: false
